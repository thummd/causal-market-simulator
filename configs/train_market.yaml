# Train the continuous-time DoT-PFN on the market prior (Phase 2).
# Same layout as train_dotpfn.yaml; prior.mode=market switches the dataloader
# to dotime_market.prior.MarketDoTime. The causal/predictive ablation pair for
# the headline comparison trains this config twice (do-head ablation lands
# with baselines/forecasting_pfn.py).

model:
  n_max: 16
  embed_size: 256
  n_heads: 4
  n_encoder_layers: 4
  n_cross_attn_heads: 4
  context_window: 128
  n_mixer_layers: 1
  num_time_frequencies: 64
  time_min_freq: 0.01
  time_max_freq: 10.0
  tau_levels: [0.1, 0.25, 0.5, 0.75, 0.9]
  head_type: quantile
  n_buckets: 1000

prior:
  mode: market
  # Market knobs: a scalar pins the value, [lo, hi] samples per episode.
  market_coupling_gamma: [0.0, 2.0]
  market_core_share: [0.3, 0.9]
  market_impact_lambda: [0.25, 1.0]
  market_coupling_gamma_power: 1.0   # >1 skews gamma draws high (3.0 = v3 high-confounding emphasis)
  # Shared OU hyperpriors (theta upper end 1.0 keeps theta*dt/num_substeps
  # well inside the Euler-Maruyama stability region, matching train_dotpfn).
  theta_range: [0.5, 1.0]
  sigma_range: [0.2, 0.6]
  weight_scale: 0.5           # unused in market mode (kept for kwarg symmetry)
  num_substeps: 2
  schedule: regular
  dt: 1.0
  jitter: 0.3
  exp_rate: 1.0
  pair_mode: counterfactual
  t_range: [60, 120]
  intervention_kind_probs: [1.0, 0.0, 0.0]   # hard only: do(A=c) is the metaorder
  intervention_source: prior
  intervention_value_scale: 2.0
  intervention_window_frac: [0.1, 0.3]
  soft_shift_scale: 1.0
  time_varying_profile: random
  p_no_context: 0.0
  # Unused in market mode (random-graph knobs, kept for kwarg symmetry):
  tscm_structure: back_door
  n_min_prior: 3
  n_max_prior: 10
  edge_prob: 0.3
  hidden_prob: 0.0
  regime_prob: 0.0
  regime_count_range: [2, 3]
  mechanism_kind: linear
  p_neural: 0.0
  neural_hidden_dim: 8
  neural_out_scale_range: [0.5, 2.0]

training:
  batch_size: 32
  lr: 0.0002
  warmup_steps: 200
  total_steps: 5000
  weight_decay: 0.01
  grad_clip: 1.0
  eval_every: 500
  eval_num_steps: 20
  seed: 42
  prefetch: 2
  target_key: Y_true
  n_queries: 1
  query_mode: single
  early_stop_patience: 0
